name: RAM Constrained 7B

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sevenb-ram-constrained.yml'
  pull_request:
    paths:
      - '.github/workflows/sevenb-ram-constrained.yml'

permissions:
  contents: read

env:
  MODEL: openlm-research-open_llama_7b_v2-Q4_0.gguf
  MODEL_URL: https://huggingface.co/maddes8cht/openlm-research-open_llama_7b_v2-gguf/resolve/main/openlm-research-open_llama_7b_v2-Q4_0.gguf?download=true
  MODEL_SHA256: 892f6e2e840ed98bb7bc1d74da67ae0cca52b2d90b0316d0a7e66a37a5a60760
  THREADS: 4
  CTX: 768
  PROMPT: 128
  GEN: 32
  BATCH: 32
  KV: f16
  LLAMA_CPP_REF: 6503355df0eb4f65875012523263c302fe0088c1
  OMP_NUM_THREADS: 4
  OMP_DYNAMIC: 'FALSE'
  OMP_PROC_BIND: close
  OMP_PLACES: cores
  MALLOC_ARENA_MAX: 2
  BOUNDARY_GRANULARITY_MIB: 32
  BOUNDARY_INITIAL_LOW_MIB: 3328
  BOUNDARY_INITIAL_HIGH_MIB: 4096
  BOUNDARY_EXPAND_STEP_MIB: 256
  BOUNDARY_FLOOR_MIB: 2048
  BOUNDARY_CONFIRM_REPEATS: 2

jobs:
  constrained-memory-7b:
    name: OpenLLaMA 7B fine memory-boundary comparison
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl git time ccache python3

      - name: Build MemVanta
        run: |
          cmake -S . -B build-ram7b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-ram7b -j "$(nproc)"
          ctest --test-dir build-ram7b --output-on-failure

      - name: Download and verify OpenLLaMA 7B Q4_0
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 5 "$MODEL_URL" -o "$MODEL"
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c - | tee model-sha-check.txt
          sha256sum "$MODEL" | tee model.sha256
          stat -c 'model_bytes=%s' "$MODEL" | tee model-size.txt
          test "$(stat -c %s "$MODEL")" -gt 3500000000

      - name: Build pinned llama.cpp CPU benchmark
        run: |
          set -euo pipefail
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_REF"
          git -C llama.cpp checkout --detach FETCH_HEAD
          cmake -S llama.cpp -B llama.cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF -DGGML_METAL=OFF -DLLAMA_CURL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build llama.cpp/build --target llama-bench -j "$(nproc)"

      - name: Verify cgroup memory controller
        run: |
          set -euo pipefail
          test -d /sys/fs/cgroup
          grep -qw memory /sys/fs/cgroup/cgroup.controllers
          systemctl --version | head -n 1
          test -n "$GITHUB_WORKSPACE"

      - name: Find 7B memory boundary
        run: |
          set -euo pipefail
          mkdir -p sevenb-ram-constrained

          {
            echo "model=$MODEL"
            cat model.sha256
            cat model-size.txt
            echo "memvanta_commit=$GITHUB_SHA"
            echo "llama_cpp_ref=$LLAMA_CPP_REF"
            echo "threads=$THREADS prompt=$PROMPT gen=$GEN ctx=$CTX batch=$BATCH kv=$KV"
            echo "boundary_granularity_mib=$BOUNDARY_GRANULARITY_MIB"
            echo "initial_low_mib=$BOUNDARY_INITIAL_LOW_MIB"
            echo "initial_high_mib=$BOUNDARY_INITIAL_HIGH_MIB"
            echo "expand_step_mib=$BOUNDARY_EXPAND_STEP_MIB"
            echo "floor_mib=$BOUNDARY_FLOOR_MIB"
            echo "confirmation_repeats=$BOUNDARY_CONFIRM_REPEATS"
            echo "cgroup=v2 systemd-run MemoryMax with MemorySwapMax=0 and MemoryAccounting=yes"
            uname -a
            lscpu
            free -h
          } > sevenb-ram-constrained/environment.txt

          echo 'runtime,phase,attempt,limit_mib,launcher_exit,exec_exit,result,memory_peak_bytes,service_result' > sevenb-ram-constrained/results.csv

          PROBE_SEQ=0
          LAST_RESULT=''
          run_limited() {
            runtime="$1"; phase="$2"; attempt="$3"; limit="$4"; shift 4
            PROBE_SEQ=$((PROBE_SEQ+1))
            unit="memvanta-7b-${runtime}-${limit}-${PROBE_SEQ}-${GITHUB_RUN_ID}"
            out="sevenb-ram-constrained/${runtime}-${phase}-${attempt}-${limit}.stdout.txt"
            err="sevenb-ram-constrained/${runtime}-${phase}-${attempt}-${limit}.stderr.txt"

            set +e
            sudo systemd-run --quiet --wait --pipe --unit="$unit" \
              -p "MemoryMax=${limit}M" \
              -p MemorySwapMax=0 \
              -p MemoryAccounting=yes \
              /usr/bin/env -C "$GITHUB_WORKSPACE" "$@" >"$out" 2>"$err"
            launch_rc=$?
            set -e

            exec_rc="$(sudo systemctl show "${unit}.service" -p ExecMainStatus --value 2>/dev/null || true)"
            service_result="$(sudo systemctl show "${unit}.service" -p Result --value 2>/dev/null || true)"
            peak="$(sudo systemctl show "${unit}.service" -p MemoryPeak --value 2>/dev/null || true)"

            result=failed
            if [ "$launch_rc" -eq 0 ] && [ "${exec_rc:-0}" -eq 0 ] && { [ -z "$service_result" ] || [ "$service_result" = success ]; }; then
              result=success
            elif [ "$service_result" = oom-kill ] || [ "${exec_rc:-}" = 9 ]; then
              result=oom
            fi
            LAST_RESULT="$result"

            echo "$runtime,$phase,$attempt,$limit,$launch_rc,${exec_rc:-unknown},$result,${peak:-unknown},${service_result:-unknown}" >> sevenb-ram-constrained/results.csv
            {
              echo
              echo "launcher_exit=$launch_rc"
              echo "exec_exit=${exec_rc:-unknown}"
              echo "service_result=${service_result:-unknown}"
              echo "memory_peak_bytes=${peak:-unknown}"
              echo "classified_result=$result"
            } >> "$err"

            sudo systemctl reset-failed "${unit}.service" >/dev/null 2>&1 || true
            sudo systemctl stop "${unit}.service" >/dev/null 2>&1 || true
          }

          run_memvanta() {
            run_limited memvanta "$1" "$2" "$3" ./build-ram7b/memvanta_real_bench \
              --model "$MODEL" --threads "$THREADS" --ctx "$CTX" \
              --prompt "$PROMPT" --gen "$GEN" --batch "$BATCH" --kv "$KV" \
              --warmup 0 --reps 1 --no-client
          }

          run_llama() {
            run_limited llama "$1" "$2" "$3" ./llama.cpp/build/bin/llama-bench \
              -m "$MODEL" -p "$PROMPT" -n "$GEN" -t "$THREADS" -r 1 \
              -b "$BATCH" -ub "$BATCH" -ctk "$KV" -ctv "$KV" -ngl 0 -o json
          }

          probe() {
            runtime="$1"; phase="$2"; attempt="$3"; limit="$4"
            if [ "$runtime" = memvanta ]; then
              run_memvanta "$phase" "$attempt" "$limit"
            else
              run_llama "$phase" "$attempt" "$limit"
            fi
            if [ "$LAST_RESULT" = failed ]; then
              echo "Non-OOM execution failure for $runtime at ${limit} MiB; refusing to treat it as a memory boundary." >&2
              exit 1
            fi
          }

          search_boundary() {
            runtime="$1"
            low="$BOUNDARY_INITIAL_LOW_MIB"
            high="$BOUNDARY_INITIAL_HIGH_MIB"

            probe "$runtime" bracket-high 1 "$high"
            if [ "$LAST_RESULT" != success ]; then
              echo "$runtime did not establish a successful upper bracket at ${high} MiB" >&2
              exit 1
            fi

            probe "$runtime" bracket-low 1 "$low"
            while [ "$LAST_RESULT" = success ] && [ "$low" -gt "$BOUNDARY_FLOOR_MIB" ]; do
              high="$low"
              low=$((low-BOUNDARY_EXPAND_STEP_MIB))
              if [ "$low" -lt "$BOUNDARY_FLOOR_MIB" ]; then low="$BOUNDARY_FLOOR_MIB"; fi
              probe "$runtime" expand-low 1 "$low"
            done
            if [ "$LAST_RESULT" != oom ]; then
              echo "$runtime did not establish an OOM lower bracket down to ${low} MiB" >&2
              exit 1
            fi

            while [ $((high-low)) -gt "$BOUNDARY_GRANULARITY_MIB" ]; do
              mid=$((((low+high)/2)/BOUNDARY_GRANULARITY_MIB*BOUNDARY_GRANULARITY_MIB))
              if [ "$mid" -le "$low" ]; then mid=$((low+BOUNDARY_GRANULARITY_MIB)); fi
              if [ "$mid" -ge "$high" ]; then mid=$((high-BOUNDARY_GRANULARITY_MIB)); fi
              probe "$runtime" binary 1 "$mid"
              if [ "$LAST_RESULT" = success ]; then
                high="$mid"
              elif [ "$LAST_RESULT" = oom ]; then
                low="$mid"
              else
                echo "Unexpected probe result: $LAST_RESULT" >&2
                exit 1
              fi
            done

            for attempt in $(seq 1 "$BOUNDARY_CONFIRM_REPEATS"); do
              probe "$runtime" confirm-fail "$attempt" "$low"
              test "$LAST_RESULT" = oom
              probe "$runtime" confirm-success "$attempt" "$high"
              test "$LAST_RESULT" = success
            done

            printf '%s_fail_mib=%s\n%s_success_mib=%s\n' "$runtime" "$low" "$runtime" "$high" >> sevenb-ram-constrained/boundaries.env
          }

          : > sevenb-ram-constrained/boundaries.env
          search_boundary memvanta
          search_boundary llama
          cat sevenb-ram-constrained/results.csv
          cat sevenb-ram-constrained/boundaries.env

      - name: Summarize and validate 7B boundary
        run: |
          python3 - <<'PY'
          import csv, pathlib, json
          o=pathlib.Path('sevenb-ram-constrained')
          rows=list(csv.DictReader((o/'results.csv').open()))
          env={}
          for line in (o/'boundaries.env').read_text().splitlines():
              k,v=line.split('=',1); env[k]=int(v)

          granularity=32
          summary={'granularity_mib':granularity,'method':'adaptive cgroup-v2 binary boundary search with repeated edge confirmation'}
          for rt in ('memvanta','llama'):
              rs=[r for r in rows if r['runtime']==rt]
              fail=env[f'{rt}_fail_mib']; success=env[f'{rt}_success_mib']
              if success-fail > granularity:
                  raise SystemExit(f'{rt}: final bracket wider than {granularity} MiB')
              success_limits=[int(r['limit_mib']) for r in rs if r['result']=='success']
              oom_limits=[int(r['limit_mib']) for r in rs if r['result']=='oom']
              if not success_limits or not oom_limits:
                  raise SystemExit(f'{rt}: missing success/OOM evidence')
              if min(success_limits) != success:
                  raise SystemExit(f'{rt}: recorded boundary does not match lowest successful probe')
              if max(oom_limits) != fail:
                  raise SystemExit(f'{rt}: recorded boundary does not match highest OOM probe')
              if any(x < success for x in success_limits) or any(x > fail for x in oom_limits):
                  raise SystemExit(f'{rt}: non-monotonic memory-boundary evidence')
              confirm_success=sum(1 for r in rs if r['phase']=='confirm-success' and int(r['limit_mib'])==success and r['result']=='success')
              confirm_fail=sum(1 for r in rs if r['phase']=='confirm-fail' and int(r['limit_mib'])==fail and r['result']=='oom')
              if confirm_success < 2 or confirm_fail < 2:
                  raise SystemExit(f'{rt}: boundary edge not confirmed twice')
              peaks=[]
              for r in rs:
                  p=r['memory_peak_bytes']
                  if p.isdigit(): peaks.append(int(p))
              summary[rt]={
                  'highest_confirmed_oom_mib':fail,
                  'lowest_confirmed_success_mib':success,
                  'boundary_interval_mib':[fail,success],
                  'confirmation_repeats':2,
                  'max_recorded_memory_peak_bytes':max(peaks) if peaks else None,
                  'runs':rs,
              }

          a=summary['memvanta']['lowest_confirmed_success_mib']
          b=summary['llama']['lowest_confirmed_success_mib']
          summary['confirmed_success_ceiling_difference_mib']=b-a
          summary['memvanta_confirmed_success_ceiling_reduction_pct']=(1-a/b)*100
          (o/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          lines=[
              '# OpenLLaMA 7B v2 fine RAM-boundary experiment','',
              'Linux cgroup-v2 `MemoryMax` search with swap disabled and memory accounting enabled. Exact same Q4_0 GGUF, CPU-only, 4 threads, pp128/tg32, context 768, batch 32, F16 KV.','',
              f"- Search granularity: {granularity} MiB",
              f"- MemVanta boundary: OOM at {summary['memvanta']['highest_confirmed_oom_mib']} MiB; succeeds at {a} MiB",
              f"- llama.cpp boundary: OOM at {summary['llama']['highest_confirmed_oom_mib']} MiB; succeeds at {b} MiB",
              f"- Difference between lowest confirmed successful ceilings: {b-a} MiB",
              f"- MemVanta lower confirmed successful ceiling: {summary['memvanta_confirmed_success_ceiling_reduction_pct']:.2f}%",
              '',
              'Each final OOM/success edge is re-run twice. This is an execution-under-pressure boundary interval on this hosted runner, not an exact minimum physical-RAM requirement and not a throughput benchmark.',
          ]
          (o/'SUMMARY.md').write_text('\n'.join(lines)+'\n')
          print((o/'SUMMARY.md').read_text())
          PY

      - name: Preserve provenance
        run: |
          cp model.sha256 sevenb-ram-constrained/
          cp model-sha-check.txt sevenb-ram-constrained/
          cp model-size.txt sevenb-ram-constrained/

      - name: Upload 7B constrained-memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memvanta-ram-constrained-7b
          path: sevenb-ram-constrained/**
          if-no-files-found: warn
          retention-days: 30
