name: Python Package

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'python/**'
      - 'CMakeLists.txt'
      - '.github/workflows/pypi-publish.yml'
  workflow_run:
    workflows:
      - Package Release
    types:
      - completed

permissions:
  contents: read

jobs:
  build:
    name: Build and test PyPI distributions
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Verify release provenance
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^project\(memvanta_cpu VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)"
          if [[ -z "${version}" ]]; then
            echo "Could not read project version from CMakeLists.txt" >&2
            exit 1
          fi
          tag="v${version}"
          git fetch --force --tags origin
          tag_sha="$(git rev-list -n 1 "${tag}")"
          if [[ "${tag_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Release tag ${tag} points to ${tag_sha}, but package source is ${GITHUB_SHA}" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build source distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --outdir wheelhouse

      - name: Build and test manylinux wheel
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: wheelhouse

      - name: Validate package metadata
        run: python -m twine check wheelhouse/*

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: wheelhouse/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/memvanta
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
