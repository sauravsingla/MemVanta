name: Temporary format runtime fix branch

on:
  push:
    branches:
      - fix/runtime-prefetch-accounting-format

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-prefetch-accounting-format
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Format touched C++ files
        run: |
          clang-format -i \
            include/memvanta/runtime.hpp \
            include/memvanta/prefetcher.hpp \
            include/memvanta/lru_cache.hpp \
            src/runtime.cpp \
            src/prefetcher.cpp \
            src/lru_cache.cpp \
            tests/tests.cpp
          git diff --check
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/memvanta/runtime.hpp include/memvanta/prefetcher.hpp include/memvanta/lru_cache.hpp \
                  src/runtime.cpp src/prefetcher.cpp src/lru_cache.cpp tests/tests.cpp
          git commit -m "Format runtime and prefetch accounting changes"
          git push
