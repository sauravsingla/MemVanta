name: Three Billion Model A/B

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/threeb-model-ab.yml'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'

permissions:
  contents: read

env:
  HF_REPO: openlm-research/open_llama_3b_v2
  MODEL: openllama-3b-v2-q4_0.gguf
  F16_MODEL: openllama-3b-v2-f16.gguf
  THREADS: 4
  CTX: 768
  PROMPT: 512
  GEN: 128
  BATCH: 32
  KV: f16
  REPS: 5
  WARMUP: 1
  LLAMA_CPP_REF: 6503355df0eb4f65875012523263c302fe0088c1
  OMP_NUM_THREADS: 4
  OMP_DYNAMIC: 'FALSE'
  OMP_PROC_BIND: close
  OMP_PLACES: cores
  MALLOC_ARENA_MAX: 2

jobs:
  openllama-3b-ab:
    name: OpenLLaMA 3B v2 Q4_0 repeated A/B
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout MemVanta
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl git time ccache python3 python3-pip
          python3 -m pip install --break-system-packages --upgrade \
            huggingface_hub transformers sentencepiece safetensors protobuf numpy

      - name: Build MemVanta
        run: |
          cmake -S . -B build-threeb -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-threeb -j "$(nproc)"
          ctest --test-dir build-threeb --output-on-failure

      - name: Prepare evidence directory
        run: mkdir -p threeb-model-ab

      - name: Build pinned llama.cpp conversion and benchmark tools
        run: |
          set -euo pipefail
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_REF"
          git -C llama.cpp checkout --detach FETCH_HEAD
          cmake -S llama.cpp -B llama.cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF -DGGML_METAL=OFF -DLLAMA_CURL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build llama.cpp/build --target llama-bench llama-quantize -j "$(nproc)"
          git -C llama.cpp rev-parse HEAD | tee threeb-model-ab/llama_cpp_commit.txt

      - name: Install pinned llama.cpp converter requirements
        run: |
          python3 -m pip install --break-system-packages \
            -r llama.cpp/requirements/requirements-convert_hf_to_gguf.txt

      - name: Resolve and download official OpenLLaMA 3B v2 source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from huggingface_hub import HfApi, snapshot_download
          import pathlib, json
          repo='openlm-research/open_llama_3b_v2'
          api=HfApi()
          info=api.model_info(repo)
          if not info.sha:
              raise SystemExit('could not resolve source revision')
          rev=info.sha
          pathlib.Path('threeb-model-ab/source-revision.txt').write_text(rev+'\n')
          pathlib.Path('threeb-model-ab/source-metadata.json').write_text(json.dumps({
              'repo':repo,
              'revision':rev,
              'modelId':getattr(info,'modelId',repo),
          },indent=2)+'\n')
          snapshot_download(
              repo_id=repo,
              revision=rev,
              local_dir='openllama-source',
              local_dir_use_symlinks=False,
          )
          print('source_revision='+rev)
          PY
          du -sh openllama-source | tee threeb-model-ab/source-size.txt
          find openllama-source -maxdepth 1 -type f -printf '%f\n' | sort > threeb-model-ab/source-files.txt

      - name: Convert official source and quantize Q4_0
        run: |
          set -euo pipefail
          python3 llama.cpp/convert_hf_to_gguf.py openllama-source \
            --outfile "$F16_MODEL" --outtype f16 \
            > threeb-model-ab/convert.stdout.txt \
            2> threeb-model-ab/convert.stderr.txt
          ./llama.cpp/build/bin/llama-quantize "$F16_MODEL" "$MODEL" Q4_0 \
            > threeb-model-ab/quantize.stdout.txt \
            2> threeb-model-ab/quantize.stderr.txt
          sha256sum "$MODEL" | tee threeb-model-ab/model.sha256
          actual_bytes="$(stat -c %s "$MODEL")"
          echo "model_bytes=$actual_bytes" | tee threeb-model-ab/model-size.txt
          test "$actual_bytes" -gt 1500000000
          python3 - <<'PY'
          import pathlib,struct,json
          p=pathlib.Path('openllama-3b-v2-q4_0.gguf')
          with p.open('rb') as f:
              magic=f.read(4)
              raw=f.read(4)
          if len(raw)!=4:
              raise SystemExit('truncated GGUF header')
          version=struct.unpack('<I',raw)[0]
          info={'magic':magic.decode('ascii','replace'),'gguf_version':version}
          pathlib.Path('threeb-model-ab/gguf-header.json').write_text(json.dumps(info,indent=2)+'\n')
          print(info)
          if magic != b'GGUF':
              raise SystemExit('invalid GGUF magic')
          if version < 2:
              raise SystemExit(f'obsolete GGUF version {version}; need >= 2')
          PY
          rm -f "$F16_MODEL"
          rm -rf openllama-source

      - name: Record provenance
        run: |
          {
            echo "model=$MODEL"
            echo "source_repo=$HF_REPO"
            echo -n "source_revision="; cat threeb-model-ab/source-revision.txt
            cat threeb-model-ab/model.sha256
            cat threeb-model-ab/model-size.txt
            cat threeb-model-ab/gguf-header.json
            echo "memvanta_commit=$GITHUB_SHA"
            echo "llama_cpp_ref=$LLAMA_CPP_REF"
            echo "threads=$THREADS prompt=$PROMPT gen=$GEN ctx=$CTX batch=$BATCH kv=$KV reps=$REPS warmup=$WARMUP"
            uname -a
            lscpu
            free -h
          } > threeb-model-ab/environment.txt

      - name: Run staged 3B compatibility gate and A/B
        continue-on-error: true
        run: |
          set +e

          ./build-threeb/memvanta_tokenize "$MODEL" 'The capital of France is' --bos \
            > threeb-model-ab/tokenizer-smoke.txt 2> threeb-model-ab/tokenizer-smoke.stderr.txt
          tok_rc=$?
          echo "$tok_rc" > threeb-model-ab/tokenizer-smoke.exitcode.txt

          timeout --signal=TERM --kill-after=15s 300 \
            ./build-threeb/memvanta_real --model "$MODEL" --threads "$THREADS" --ctx 128 \
            --temperature 0 --n 2 --prompt 'The capital of France is' \
            > threeb-model-ab/generation-smoke.txt 2> threeb-model-ab/generation-smoke.stderr.txt
          gen_rc=$?
          echo "$gen_rc" > threeb-model-ab/generation-smoke.exitcode.txt

          /usr/bin/time -v timeout --signal=TERM --kill-after=15s 600 \
            ./build-threeb/memvanta_real_bench --model "$MODEL" --threads "$THREADS" --ctx 128 \
            --prompt 32 --gen 16 --batch 16 --kv "$KV" --warmup 0 --reps 1 --no-client \
            --csv threeb-model-ab/memvanta-micro.csv \
            > threeb-model-ab/memvanta-micro.stdout.txt 2> threeb-model-ab/memvanta-micro.time.txt
          mem_micro_rc=$?
          echo "$mem_micro_rc" > threeb-model-ab/memvanta-micro.exitcode.txt

          /usr/bin/time -v timeout --signal=TERM --kill-after=15s 600 \
            ./llama.cpp/build/bin/llama-bench -m "$MODEL" -p 32 -n 16 -t "$THREADS" -r 1 \
            -b 16 -ub 16 -ctk "$KV" -ctv "$KV" -ngl 0 -o json \
            > threeb-model-ab/llama-micro.json 2> threeb-model-ab/llama-micro.time.txt
          llama_micro_rc=$?
          echo "$llama_micro_rc" > threeb-model-ab/llama-micro.exitcode.txt

          {
            echo "tokenizer_rc=$tok_rc"
            echo "generation_rc=$gen_rc"
            echo "memvanta_micro_rc=$mem_micro_rc"
            echo "llama_micro_rc=$llama_micro_rc"
          } | tee threeb-model-ab/compatibility-status.txt

          if [ "$tok_rc" -ne 0 ] || [ "$gen_rc" -ne 0 ] || [ "$mem_micro_rc" -ne 0 ] || [ "$llama_micro_rc" -ne 0 ]; then
            echo "full_benchmark=skipped_after_compatibility_failure" | tee threeb-model-ab/full-benchmark-status.txt
            exit 0
          fi

          /usr/bin/time -v timeout --signal=TERM --kill-after=30s 5400 \
            ./build-threeb/memvanta_real_bench --model "$MODEL" --threads "$THREADS" --ctx "$CTX" \
            --prompt "$PROMPT" --gen "$GEN" --batch "$BATCH" --kv "$KV" \
            --warmup "$WARMUP" --reps "$REPS" --no-client --csv threeb-model-ab/memvanta.csv \
            > threeb-model-ab/memvanta.stdout.txt 2> threeb-model-ab/memvanta.time.txt
          mem_rc=$?
          echo "$mem_rc" > threeb-model-ab/memvanta.exitcode.txt

          /usr/bin/time -v timeout --signal=TERM --kill-after=30s 3600 \
            ./llama.cpp/build/bin/llama-bench -m "$MODEL" -p "$PROMPT" -n "$GEN" -t "$THREADS" -r "$REPS" \
            -b "$BATCH" -ub "$BATCH" -ctk "$KV" -ctv "$KV" -ngl 0 -o json \
            > threeb-model-ab/llama-bench.json 2> threeb-model-ab/llama-bench.time.txt
          llama_rc=$?
          echo "$llama_rc" > threeb-model-ab/llama-bench.exitcode.txt
          printf 'memvanta_full_rc=%s\nllama_full_rc=%s\n' "$mem_rc" "$llama_rc" | tee threeb-model-ab/full-benchmark-status.txt
          exit 0

      - name: Summarize successful full A/B
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import csv,json,pathlib,re,statistics
          o=pathlib.Path('threeb-model-ab')
          mf=o/'memvanta.exitcode.txt'; lf=o/'llama-bench.exitcode.txt'
          if not mf.exists() or not lf.exists():
              (o/'diagnostic-summary.json').write_text(json.dumps({'full_benchmark':'not_completed'},indent=2)+'\n'); raise SystemExit(0)
          mrc=int(mf.read_text().strip()); lrc=int(lf.read_text().strip())
          if mrc or lrc or not (o/'memvanta.csv').exists() or not (o/'llama-bench.json').exists():
              (o/'diagnostic-summary.json').write_text(json.dumps({'memvanta_exit':mrc,'llama_exit':lrc},indent=2)+'\n'); raise SystemExit(0)
          rows=list(csv.DictReader((o/'memvanta.csv').open()))
          mpp=[float(r['pp_tps']) for r in rows]; mtg=[float(r['tg_tps']) for r in rows]
          lj=json.loads((o/'llama-bench.json').read_text()); lj=[lj] if isinstance(lj,dict) else lj
          lpp=[]; ltg=[]
          for r in lj:
              vals=[float(x) for x in (r.get('samples_ts') or [r.get('avg_ts')]) if x is not None]
              if int(r.get('n_prompt',0) or 0) and not int(r.get('n_gen',0) or 0): lpp += vals
              if int(r.get('n_gen',0) or 0) and not int(r.get('n_prompt',0) or 0): ltg += vals
          def rss(p):
              m=re.search(r'Maximum resident set size \(kbytes\):\s*(\d+)',p.read_text(errors='replace')); return int(m.group(1)) if m else None
          def d(x): return {'mean':statistics.mean(x),'sd':statistics.stdev(x),'cv_pct':statistics.stdev(x)/statistics.mean(x)*100}
          s={'benchmark':'OpenLLaMA 3B v2 Q4_0 same-model CPU A/B','memvanta_pp':d(mpp),'memvanta_tg':d(mtg),'llama_pp':d(lpp),'llama_tg':d(ltg),'memvanta_peak_rss_kib':rss(o/'memvanta.time.txt'),'llama_peak_rss_kib':rss(o/'llama-bench.time.txt')}
          s['llama_vs_memvanta_pp_speedup']=s['llama_pp']['mean']/s['memvanta_pp']['mean']
          s['llama_vs_memvanta_tg_speedup']=s['llama_tg']['mean']/s['memvanta_tg']['mean']
          s['memvanta_rss_reduction_pct']=(1-s['memvanta_peak_rss_kib']/s['llama_peak_rss_kib'])*100
          (o/'summary.json').write_text(json.dumps(s,indent=2)+'\n')
          (o/'SUMMARY.md').write_text(f"# OpenLLaMA 3B v2 Q4_0 — MemVanta vs llama.cpp\n\nGenerated from the pinned official OpenLLaMA source revision, then benchmarked as the exact same GGUF on both runtimes. CPU-only, 4 threads, pp512/tg128, context 768, batch 32, F16 KV, 5 repetitions.\n\n- MemVanta pp: {s['memvanta_pp']['mean']:.2f} ± {s['memvanta_pp']['sd']:.2f} tok/s\n- llama.cpp pp: {s['llama_pp']['mean']:.2f} ± {s['llama_pp']['sd']:.2f} tok/s\n- MemVanta tg: {s['memvanta_tg']['mean']:.2f} ± {s['memvanta_tg']['sd']:.2f} tok/s\n- llama.cpp tg: {s['llama_tg']['mean']:.2f} ± {s['llama_tg']['sd']:.2f} tok/s\n- MemVanta peak RSS: {s['memvanta_peak_rss_kib']} KiB\n- llama.cpp peak RSS: {s['llama_peak_rss_kib']} KiB\n- MemVanta RSS reduction: {s['memvanta_rss_reduction_pct']:.2f}%\n")
          print((o/'SUMMARY.md').read_text())
          PY

      - name: Upload benchmark and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memvanta-threeb-model-ab
          path: threeb-model-ab/**
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce benchmark success after evidence upload
        if: always()
        run: |
          tok_rc="$(cat threeb-model-ab/tokenizer-smoke.exitcode.txt 2>/dev/null || echo 127)"
          gen_rc="$(cat threeb-model-ab/generation-smoke.exitcode.txt 2>/dev/null || echo 127)"
          mem_micro_rc="$(cat threeb-model-ab/memvanta-micro.exitcode.txt 2>/dev/null || echo 127)"
          llama_micro_rc="$(cat threeb-model-ab/llama-micro.exitcode.txt 2>/dev/null || echo 127)"
          mem_rc="$(cat threeb-model-ab/memvanta.exitcode.txt 2>/dev/null || echo 127)"
          llama_rc="$(cat threeb-model-ab/llama-bench.exitcode.txt 2>/dev/null || echo 127)"
          echo "compatibility: tokenizer=$tok_rc generation=$gen_rc memvanta=$mem_micro_rc llama=$llama_micro_rc"
          echo "full: memvanta=$mem_rc llama=$llama_rc"
          test "$tok_rc" -eq 0
          test "$gen_rc" -eq 0
          test "$mem_micro_rc" -eq 0
          test "$llama_micro_rc" -eq 0
          test "$mem_rc" -eq 0
          test "$llama_rc" -eq 0