name: Real Model Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/real-model-ab.yml'
      - 'src/**'
      - 'include/**'
      - 'benchmarks/**'
      - 'tests/**'
      - 'scripts/**'
      - 'CMakeLists.txt'

permissions:
  contents: read

env:
  MODEL: stories15M-q4_0.gguf
  MODEL_URL: https://huggingface.co/ggml-org/models-moved/resolve/main/tinyllamas/stories15M-q4_0.gguf?download=true
  MODEL_SHA256: 66967fbece6dbe97886593fdbb73589584927e29119ec31f08090732d1861739
  THREADS: 4
  CTX: 128

jobs:
  trained-model-smoke:
    name: Trained model smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout MemVanta
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl time

      - name: Record benchmark provenance
        run: |
          {
            echo "memvanta_commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            uname -a
            lscpu
            cmake --version | head -n 1
            c++ --version | head -n 1
          } > benchmark-provenance.txt
          cat benchmark-provenance.txt

      - name: Build MemVanta
        run: |
          cmake -S . -B build-v072 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-v072 -j "$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build-v072 --output-on-failure

      - name: Download and verify trained TinyStories model
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "$MODEL_URL" -o "$MODEL"
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c -
          stat -c 'model_bytes=%s' "$MODEL"

      - name: Tokenizer smoke test
        run: |
          ./build-v072/memvanta_tokenize "$MODEL" 'Once upon a time' --bos \
            | tee memvanta-tokenizer-smoke.txt

      - name: Trained-model greedy generation
        run: |
          timeout --signal=TERM --kill-after=15s 180 \
            /usr/bin/time -v ./build-v072/memvanta_real \
              --model "$MODEL" --threads "$THREADS" --ctx "$CTX" \
              --temperature 0 --n 8 --prompt 'Once upon a time' \
              > memvanta-trained-smoke.txt 2> memvanta-trained-smoke.stderr.txt
          cat memvanta-trained-smoke.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memvanta-trained-model-smoke
          path: |
            benchmark-provenance.txt
            memvanta-tokenizer-smoke.txt
            memvanta-trained-smoke.txt
            memvanta-trained-smoke.stderr.txt
          if-no-files-found: warn
          retention-days: 30

  stories15m-ab:
    name: Stories15M repeated A/B benchmark
    needs: trained-model-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      REPS: 5
      WARMUP: 1
      PROMPT: 64
      GEN: 64
      BATCH: 32
      KV: f16
      MEMVANTA_TIMEOUT: 1800
      LLAMA_TIMEOUT: 900
      OUT: v072_stories15m_ab
      LLAMA_CPP_REF: 6503355df0eb4f65875012523263c302fe0088c1
      OMP_NUM_THREADS: 4
      OMP_DYNAMIC: 'FALSE'
      OMP_PROC_BIND: close
      OMP_PLACES: cores
      MALLOC_ARENA_MAX: 2

    steps:
      - name: Checkout MemVanta
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl git time ccache

      - name: Record benchmark provenance
        run: |
          mkdir -p "$OUT"
          {
            echo "memvanta_commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "llama_cpp_ref=$LLAMA_CPP_REF"
            echo "threads=$THREADS"
            echo "context=$CTX"
            echo "prompt=$PROMPT"
            echo "generation=$GEN"
            echo "batch=$BATCH"
            echo "kv=$KV"
            echo "warmup=$WARMUP"
            echo "repetitions=$REPS"
            uname -a
            lscpu
            cmake --version | head -n 1
            c++ --version | head -n 1
          } > "$OUT/benchmark-provenance.txt"
          cat "$OUT/benchmark-provenance.txt"

      - name: Configure compiler cache
        run: |
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: memvanta-llama-ccache-${{ runner.os }}-${{ env.LLAMA_CPP_REF }}
          restore-keys: |
            memvanta-llama-ccache-${{ runner.os }}-

      - name: Build MemVanta
        run: |
          cmake -S . -B build-v072 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-v072 -j "$(nproc)"
          ctest --test-dir build-v072 --output-on-failure

      - name: Download and verify trained TinyStories model
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "$MODEL_URL" -o "$MODEL"
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c -
          stat -c 'model_bytes=%s' "$MODEL"

      - name: Build pinned llama.cpp CPU tools
        run: |
          git init llama.cpp
          git -C llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_CPP_REF"
          git -C llama.cpp checkout --detach FETCH_HEAD
          echo "llama_cpp_commit=$(git -C llama.cpp rev-parse HEAD)" | tee llama_cpp_commit.txt
          cmake -S llama.cpp -B llama.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGGML_CUDA=OFF \
            -DGGML_METAL=OFF \
            -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --target llama-bench llama-cli -j "$(nproc)"
          ccache --show-stats

      - name: Run repeated same-model A/B
        env:
          LLAMA_BIN: ./llama.cpp/build/bin
        run: bash scripts/run_stories15m_ab.sh "$MODEL"

      - name: Profile MemVanta trained-model execution
        run: |
          timeout --signal=TERM --kill-after=15s 300 \
            ./build-v072/memvanta_profile \
              --model "$MODEL" --threads "$THREADS" --ctx "$CTX" \
              --prompt 32 --gen 8 --batch 16 \
              --csv "$OUT/layer-profile.csv" \
            | tee "$OUT/layer-profile.txt"

      - name: Show benchmark summary and progress
        if: always()
        run: |
          if [ -f "$OUT/progress.txt" ]; then cat "$OUT/progress.txt"; fi
          if [ -f "$OUT/memvanta.exitcode.txt" ]; then echo "memvanta_exit=$(cat "$OUT/memvanta.exitcode.txt")"; fi
          if [ -f "$OUT/llama-bench.exitcode.txt" ]; then echo "llama_exit=$(cat "$OUT/llama-bench.exitcode.txt")"; fi
          if [ -f "$OUT/SUMMARY.md" ]; then cat "$OUT/SUMMARY.md"; fi
          if [ -f "$OUT/summary.json" ]; then cat "$OUT/summary.json"; fi
          if [ -f "$OUT/layer-profile.txt" ]; then cat "$OUT/layer-profile.txt"; fi

      - name: Upload raw benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memvanta-stories15m-repeated-ab
          path: |
            v072_stories15m_ab/**
            llama_cpp_commit.txt
          if-no-files-found: warn
          retention-days: 30
