name: Medium Model Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/medium-model-validation.yml'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'

permissions:
  contents: read

env:
  MODEL: SmolLM2-360M.Q4_0.gguf
  MODEL_URL: https://huggingface.co/QuantFactory/SmolLM2-360M-GGUF/resolve/main/SmolLM2-360M.Q4_0.gguf?download=true
  MODEL_SHA256: 88bbd5cac17036bf50905a0a660078b63426cea1c7fc6e4afa955bc8422b043c
  THREADS: 4
  CTX: 128
  OMP_NUM_THREADS: 4
  OMP_DYNAMIC: 'FALSE'
  OMP_PROC_BIND: close
  OMP_PLACES: cores
  MALLOC_ARENA_MAX: 2

jobs:
  smollm2-360m-smoke:
    name: SmolLM2 360M Q4_0 smoke and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl time

      - name: Record benchmark provenance
        run: |
          {
            echo "memvanta_commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            uname -a
            lscpu
            cmake --version | head -n 1
            c++ --version | head -n 1
          } > benchmark-provenance.txt
          cat benchmark-provenance.txt

      - name: Build and test
        run: |
          cmake -S . -B build-medium -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-medium -j "$(nproc)"
          ctest --test-dir build-medium --output-on-failure

      - name: Download and verify SmolLM2 360M
        run: |
          curl -L --fail --retry 3 --retry-delay 2 "$MODEL_URL" -o "$MODEL"
          echo "$MODEL_SHA256  $MODEL" | sha256sum -c -
          stat -c 'model_bytes=%s' "$MODEL" | tee medium-model-size.txt

      - name: Tokenizer smoke
        run: |
          ./build-medium/memvanta_tokenize "$MODEL" 'The capital of France is' --bos \
            | tee medium-tokenizer.txt

      - name: Greedy generation smoke
        run: |
          timeout --signal=TERM --kill-after=15s 600 \
            /usr/bin/time -v ./build-medium/memvanta_real \
              --model "$MODEL" --threads "$THREADS" --ctx "$CTX" \
              --temperature 0 --n 8 --prompt 'The capital of France is' \
              > medium-greedy.txt 2> medium-greedy.time.txt
          cat medium-greedy.txt

      - name: Short real-model benchmark
        run: |
          timeout --signal=TERM --kill-after=15s 900 \
            /usr/bin/time -v ./build-medium/memvanta_real_bench \
              --model "$MODEL" --threads "$THREADS" --ctx "$CTX" \
              --batch 16 --kv f16 --prompt 32 --gen 16 --reps 1 --warmup 0 \
              > medium-bench.txt 2> medium-bench.time.txt
          cat medium-bench.txt

      - name: Upload medium-model evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: memvanta-smollm2-360m-evidence
          path: |
            benchmark-provenance.txt
            medium-model-size.txt
            medium-tokenizer.txt
            medium-greedy.txt
            medium-greedy.time.txt
            medium-bench.txt
            medium-bench.time.txt
          if-no-files-found: warn
          retention-days: 30
