name: Temporary tighten prefetch hot path

on:
  push:
    branches:
      - fix/runtime-prefetch-accounting-format

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-prefetch-accounting-format
      - name: Patch hot-path pending lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/runtime.cpp')
          s = p.read_text()
          old = '''                if (cfg_.copy_cache && (cache_.contains(id) || prefetcher_.pending(id))) {\n                    continue;\n                }\n'''
          new = '''                if (cfg_.copy_cache && (cache_.contains(id) || late_pending.contains(id))) {\n                    continue;\n                }\n'''
          if old not in s:
              raise SystemExit('candidate block not found')
          s = s.replace(old, new, 1)
          old = '''        for (const auto& [id, bytes] : requested) {\n            (void)id;\n            ++pf.unused;\n            pf.bytes_unused += bytes;\n        }\n        requested.clear();\n        inflight_bytes = 0;\n'''
          new = '''        for (const auto& [id, bytes] : requested) {\n            ++pf.unused;\n            pf.bytes_unused += bytes;\n            if (cfg_.copy_cache && prefetcher_.pending(id)) {\n                const auto [late_it, inserted] = late_pending.emplace(id, bytes);\n                (void)late_it;\n                if (inserted) {\n                    late_pending_bytes += bytes;\n                }\n            }\n        }\n        record_reserved_peak();\n        requested.clear();\n        inflight_bytes = 0;\n'''
          if old not in s:
              raise SystemExit('pass-end block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          clang-format -i src/runtime.cpp
          git diff --check
      - name: Commit correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime.cpp
          git commit -m "Avoid per-candidate prefetcher locking"
          git push
