name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_pages.py"
      - "scripts/check_pages.py"
      - ".github/scripts/check_social_preview.py"
      - "results/openllama-7b-v2-ab/summary.json"
      - "google6f58f6dc503549cc.html"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Publish Benchmark Results"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site from canonical benchmark
        run: python3 scripts/build_pages.py

      - name: Add Google Search Console verification
        run: cp google6f58f6dc503549cc.html _site/google6f58f6dc503549cc.html

      - name: Validate site discovery and internal links
        run: python3 scripts/check_pages.py _site

      - name: Validate large social previews
        run: python3 .github/scripts/check_social_preview.py _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
