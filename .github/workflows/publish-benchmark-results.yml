name: Publish Benchmark Results

on:
  workflow_run:
    workflows:
      - Real Model Validation
      - Medium Model Validation
      - Medium Model A/B
      - One Billion Model A/B
      - RAM Constrained 1B
      - Three Billion Model A/B
      - Seven Billion Feasibility
      - Seven Billion Model A/B
      - RAM Constrained 7B
      - Seven Billion Throughput Profile
      - Seven Billion FFN Tuning
      - Seven Billion FFN Kernel A/B
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Decide whether evidence should be published
        id: gate
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          publish=false

          if [ "$HEAD_BRANCH" = "main" ]; then
            if [ "$CONCLUSION" = "success" ]; then
              publish=true
            else
              case "$WORKFLOW_NAME" in
                "One Billion Model A/B"|\
                "Three Billion Model A/B"|\
                "Seven Billion Feasibility"|\
                "Seven Billion Model A/B"|\
                "RAM Constrained 7B"|\
                "Seven Billion Throughput Profile"|\
                "Seven Billion FFN Tuning"|\
                "Seven Billion FFN Kernel A/B")
                  publish=true
                  ;;
              esac
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "workflow=$WORKFLOW_NAME branch=$HEAD_BRANCH conclusion=$CONCLUSION publish=$publish"

      - name: Skip ineligible publication cleanly
        if: steps.gate.outputs.publish != 'true'
        run: echo "No benchmark evidence publication is required for this workflow completion."

      - name: Checkout main
        if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download benchmark artifact
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: downloaded-evidence

      - name: Preserve evidence under results
        if: steps.gate.outputs.publish == 'true'
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          mkdir -p results

          if [ "$WORKFLOW_NAME" = "Real Model Validation" ]; then
            SRC="downloaded-evidence/memvanta-stories15m-repeated-ab"
            DEST="results/stories15m-repeated-ab"
          elif [ "$WORKFLOW_NAME" = "Medium Model Validation" ]; then
            SRC="downloaded-evidence/memvanta-smollm2-360m-evidence"
            DEST="results/smollm2-360m"
          elif [ "$WORKFLOW_NAME" = "Medium Model A/B" ]; then
            SRC="downloaded-evidence/memvanta-smollm2-360m-ab"
            DEST="results/smollm2-360m-ab"
          elif [ "$WORKFLOW_NAME" = "One Billion Model A/B" ]; then
            SRC="downloaded-evidence/memvanta-oneb-model-ab"
            if [ "$CONCLUSION" = "success" ]; then
              DEST="results/tinyllama-1.1b-ab"
            else
              DEST="results/diagnostics/tinyllama-1.1b-ab-run-${RUN_ID}"
            fi
          elif [ "$WORKFLOW_NAME" = "RAM Constrained 1B" ]; then
            SRC="downloaded-evidence/memvanta-ram-constrained-1b"
            DEST="results/tinyllama-1.1b-ram-constrained"
          elif [ "$WORKFLOW_NAME" = "Three Billion Model A/B" ]; then
            SRC="downloaded-evidence/memvanta-threeb-model-ab"
            if [ "$CONCLUSION" = "success" ]; then
              DEST="results/openllama-3b-v2-ab"
            else
              DEST="results/diagnostics/openllama-3b-v2-ab-run-${RUN_ID}"
            fi
          elif [ "$WORKFLOW_NAME" = "Seven Billion Feasibility" ]; then
            SRC="downloaded-evidence/memvanta-sevenb-feasibility"
            if [ "$CONCLUSION" = "success" ]; then
              DEST="results/openllama-7b-v2-feasibility"
            else
              DEST="results/diagnostics/openllama-7b-v2-feasibility-run-${RUN_ID}"
            fi
          elif [ "$WORKFLOW_NAME" = "Seven Billion Model A/B" ]; then
            SRC="downloaded-evidence/memvanta-sevenb-model-ab"
            if [ "$CONCLUSION" = "success" ]; then
              DEST="results/openllama-7b-v2-ab"
            else
              DEST="results/diagnostics/openllama-7b-v2-ab-run-${RUN_ID}"
            fi
          elif [ "$WORKFLOW_NAME" = "RAM Constrained 7B" ]; then
            SRC="downloaded-evidence/memvanta-ram-constrained-7b"
            if [ "$CONCLUSION" = "success" ]; then
              DEST="results/openllama-7b-v2-ram-constrained"
            else
              DEST="results/diagnostics/openllama-7b-v2-ram-constrained-run-${RUN_ID}"
            fi
          elif [ "$WORKFLOW_NAME" = "Seven Billion Throughput Profile" ]; then
            SRC="downloaded-evidence/memvanta-sevenb-throughput-profile"
            if [ "$CONCLUSION" = "success" ]; then
              DEST="results/openllama-7b-v2-throughput-profile"
            else
              DEST="results/diagnostics/openllama-7b-v2-throughput-profile-run-${RUN_ID}"
            fi
          elif [ "$WORKFLOW_NAME" = "Seven Billion FFN Tuning" ]; then
            SRC="downloaded-evidence/memvanta-sevenb-ffn-tuning"
            if [ "$CONCLUSION" = "success" ]; then
              DEST="results/openllama-7b-v2-ffn-tuning"
            else
              DEST="results/diagnostics/openllama-7b-v2-ffn-tuning-run-${RUN_ID}"
            fi
          elif [ "$WORKFLOW_NAME" = "Seven Billion FFN Kernel A/B" ]; then
            SRC="downloaded-evidence/memvanta-sevenb-ffn-kernel-ab"
            if [ "$CONCLUSION" = "success" ]; then
              DEST="results/openllama-7b-v2-ffn-kernel-ab"
            else
              DEST="results/diagnostics/openllama-7b-v2-ffn-kernel-ab-run-${RUN_ID}"
            fi
          else
            echo "Unsupported workflow: $WORKFLOW_NAME" >&2
            exit 1
          fi

          test -d "$SRC"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a "$SRC"/. "$DEST"/

          cat > "$DEST/WORKFLOW_RUN.md" <<EOF
          # Workflow run provenance

          - Workflow: $WORKFLOW_NAME
          - Run ID: $RUN_ID
          - Run number: $RUN_NUMBER
          - MemVanta commit: $HEAD_SHA
          - Run URL: $RUN_URL
          - Conclusion: $CONCLUSION
          EOF

          find "$DEST" -maxdepth 2 -type f -print | sort

      - name: Commit published evidence
        if: steps.gate.outputs.publish == 'true'
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/
          if git diff --cached --quiet; then
            echo "No evidence changes to commit"
            exit 0
          fi
          git commit -m "Publish benchmark evidence from ${WORKFLOW_NAME} run ${RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
